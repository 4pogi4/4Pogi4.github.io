<!DOCTYPE html>
<html lang="en">
<head>
  <title>Age Calculator - Find Exact Age from Date of Birth | Pogi Tools</title>
<meta name="description" content="Free Age Calculator. Calculate exact age in years, months, days from DOB to today. Also find next birthday.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 500px; margin: auto; }
h1 { text-align: center; color: #2c3e50; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 12px; margin-top: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #219150; }
.result { margin-top: 20px; padding: 20px; background: #eaf1; border-radius: 8px; display: none; }
.result h2 { text-align: center; color: #27ae60; margin: 10px 0; }
.grid-result { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: white; padding: 12px; border-radius: 8px; text-align: center; }
.box span { font-size: 20px; font-weight: bold; color: #2c3e50; display: block; }
.back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #2c3e50; }
</style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEDR5G54L6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZEDR5G54L6');
</script>
</head>
<body>

<h1>Age Calculator</h1>
<div class="card">
  <label>Your Date of Birth</label>
  <input type="date" id="dob">

  <button onclick="calculateAge()">Calculate Age</button>

  <div class="result" id="resultBox">
    <h2>Your Age Is</h2>
    <div class="grid-result">
      <div class="box">
        Years<br><span id="years"></span>
      </div>
      <div class="box">
        Months<br><span id="months"></span>
      </div>
      <div class="box">
        Days<br><span id="days"></span>
      </div>
      <div class="box">
        Total Days<br><span id="totalDays"></span>
      </div>
    </div>
    <p style="text-align:center; margin-top:15px;">Next Birthday: <b id="nextBday"></b> days</p>
  </div>
</div>

<a href="/" class="back">← Back to Home</a>

<script>
function calculateAge() {
  let dob = new Date(document.getElementById('dob').value);
  let today = new Date();

  if(!dob) { alert("Please select your date of birth"); return; }
  if(dob > today) { alert("DOB cannot be in future"); return; }

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();

  if(days < 0) {
    months--;
    days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
  }
  if(months < 0) {
    years--;
    months += 12;
  }

  // Total days
  let diffTime = Math.abs(today - dob);
  let totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

  // Next birthday
  let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if(nextBday < today) nextBday.setFullYear(today.getFullYear() + 1);
  let daysToBday = Math.ceil((nextBday - today) / (1000 * 60 * 60 * 24));

  document.getElementById('years').innerText = years;
  document.getElementById('months').innerText = months;
  document.getElementById('days').innerText = days;
  document.getElementById('totalDays').innerText = totalDays.toLocaleString('en-IN');
  document.getElementById('nextBday').innerText = daysToBday;
  document.getElementById('resultBox').style.display = 'block';
}

// Set max date to today
document.getElementById('dob').max = new Date().toISOString().split("T")[0];
</script>

</body>
  </html>

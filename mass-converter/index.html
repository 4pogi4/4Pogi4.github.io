<!DOCTYPE html>
<html lang="en">
<head>
  <title>Mass Converter - KG, Gram, Pound, Ounce Conversion | Pogi Tools</title>
<meta name="description" content="Free Mass Converter. Convert KG, Gram, Milligram, Pound, Ounce, Ton instantly. Accurate unit conversion tool.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 500px; margin: auto; }
h1 { text-align: center; color: #2c3e50; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
.result { margin-top: 20px; padding: 20px; background: #eaf1; border-radius: 8px; text-align: center; font-size: 22px; font-weight: bold; }
.common { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
.common-btn { padding: 8px; background: #ecf0f1; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.common-btn:hover { background: #bdc3c7; }
.back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #2c3e50; }
</style>
</head>
<body>

<h1>Mass Converter</h1>
<div class="card">
  <label>Value</label>
  <input type="number" id="value" placeholder="Enter weight" value="1" oninput="convert()">

  <label>From</label>
  <select id="from" onchange="convert()"></select>

  <label>To</label>
  <select id="to" onchange="convert()"></select>

  <div class="result" id="resultBox"></div>

  <label>Common Conversions</label>
  <div class="common">
    <button class="common-btn" onclick="quick(1, 'kg', 'pound')">1 kg to pound</button>
    <button class="common-btn" onclick="quick(1, 'pound', 'kg')">1 pound to kg</button>
    <button class="common-btn" onclick="quick(1000, 'g', 'kg')">1000 g to kg</button>
    <button class="common-btn" onclick="quick(1, 'ton', 'kg')">1 ton to kg</button>
  </div>
</div>

<a href="/" class="back">← Back to Home</a>

<script>
const units = {
  name: ['mg', 'g', 'kg', 'ton', 'ounce', 'pound', 'stone'],
  toKg: [0.000001, 0.001, 1, 1000, 0.0283495, 0.453592, 6.35029]
};

function loadUnits() {
  let from = document.getElementById('from');
  let to = document.getElementById('to');
  from.innerHTML = '';
  to.innerHTML = '';
  
  units.name.forEach((u, i) => {
    from.innerHTML += `<option value="${i}">${u}</option>`;
    to.innerHTML += `<option value="${i}">${u}</option>`;
  });
  from.selectedIndex = 2; // kg
  to.selectedIndex = 5; // pound
}

function convert() {
  let val = parseFloat(document.getElementById('value').value);
  let from = parseInt(document.getElementById('from').value);
  let to = parseInt(document.getElementById('to').value);
  
  if(isNaN(val)) return;
  
  let inKg = val * units.toKg[from];
  let result = inKg / units.toKg[to];

  document.getElementById('resultBox').innerText = 
    `${val} ${units.name[from]} = ${result.toFixed(4)} ${units.name[to]}`;
}

function quick(val, fromUnit, toUnit) {
  document.getElementById('value').value = val;
  document.getElementById('from').value = units.name.indexOf(fromUnit);
  document.getElementById('to').value = units.name.indexOf(toUnit);
  convert();
}

// THE FIX: Wait for page to load before running
window.onload = function() {
  loadUnits();
  convert();
};
</script>

</body>

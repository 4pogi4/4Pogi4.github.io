<!DOCTYPE html>
<html lang="en">
<head>
  <title>BMI Calculator - Body Mass Index for Men & Women | Pogi Tools</title>
<meta name="description" content="Free BMI Calculator. Check your Body Mass Index for Men and Women. Get health category: Underweight, Normal, Overweight, Obese.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 500px; margin: auto; }
h1 { text-align: center; color: #2c3e50; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 12px; margin-top: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #219150; }
.result { margin-top: 20px; padding: 20px; border-radius: 8px; text-align: center; display: none; }
.bmi-value { font-size: 40px; font-weight: bold; }
.bmi-category { font-size: 20px; margin-top: 5px; }
.note { font-size: 12px; color: #777; margin-top: 15px; }
.back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #2c3e50; }
.scale { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; font-size: 14px; }
</style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEDR5G54L6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZEDR5G54L6');
</script>
</head>
<body>

<h1>BMI Calculator</h1>
<div class="card">
  <label>Height (cm)</label>
  <input type="number" id="height" placeholder="e.g. 170" value="170">

  <label>Weight (kg)</label>
  <input type="number" id="weight" placeholder="e.g. 65" value="65">

  <button onclick="calculateBMI()">Calculate BMI</button>

  <div class="result" id="resultBox">
    <div class="bmi-value" id="bmiValue"></div>
    <div class="bmi-category" id="bmiCategory"></div>
    
    <div class="scale">
      <b>BMI Categories:</b><br>
      Underweight: &lt; 18.5<br>
      Normal: 18.5 - 24.9<br>
      Overweight: 25 - 29.9<br>
      Obese: ≥ 30
    </div>
  </div>
  <p class="note">*BMI is a general indicator. Consult a doctor for health advice.</p>
</div>

<a href="/" class="back">← Back to Home</a>

<script>
function calculateBMI() {
  let height = parseFloat(document.getElementById('height').value) / 100; // convert cm to m
  let weight = parseFloat(document.getElementById('weight').value);

  if(!height || !weight || height <= 0 || weight <= 0) { 
    alert("Please enter valid height and weight"); 
    return; 
  }

  let bmi = weight / (height * height);
  let category = "";
  let color = "";

  if(bmi < 18.5) {
    category = "Underweight";
    color = "#3498db";
  } else if(bmi < 24.9) {
    category = "Normal";
    color = "#27ae60";
  } else if(bmi < 29.9) {
    category = "Overweight";
    color = "#f39c12";
  } else {
    category = "Obese";
    color = "#e74c3c";
  }

  document.getElementById('bmiValue').innerText = bmi.toFixed(1);
  document.getElementById('bmiCategory').innerText = category;
  document.getElementById('resultBox').style.background = color + "20";
  document.getElementById('resultBox').style.color = color;
  document.getElementById('resultBox').style.display = 'block';
}

// Run on load
calculateBMI();
</script>

</body>
  </html>

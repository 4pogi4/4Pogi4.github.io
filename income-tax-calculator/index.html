<!DOCTYPE html>
<html lang="en">
<head>
  <title>Income Tax Calculator India 2026 - Old vs New Regime | Pogi Tools</title>
<meta name="description" content="Free Income Tax Calculator India FY 2025-26. Calculate tax for Old & New Regime, cess, rebate u/s 87A. For Salaried & Self Employed.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 600px; margin: auto; }
h1 { text-align: center; color: #2c3e50; font-size: 22px; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 12px; margin-top: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #219150; }
.result { margin-top: 20px; padding: 15px; background: #eafaf1; border-radius: 8px; display: none; }
.result h3 { margin: 5px 0; color: #27ae60; }
.note { font-size: 12px; color: #777; margin-top: 15px; }
.back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #2c3e50; }
</style>
</head>
<body>

<h1>Income Tax Calculator FY 2025-26</h1>
<div class="card">
  <label>Annual Income ₹</label>
  <input type="number" id="income" placeholder="e.g. 1200000">

  <label>Tax Regime</label>
  <select id="regime">
    <option value="new">New Regime</option>
    <option value="old">Old Regime</option>
  </select>

  <label>Deductions ₹ (Only for Old Regime)</label>
  <input type="number" id="deduction" placeholder="80C, 80D, HRA etc" value="0">

  <button onclick="calculateTax()">Calculate Tax</button>

  <div class="result" id="resultBox">
    <h3>Total Tax: ₹<span id="tax"></span></h3>
    <p>Tax + 4% Cess: ₹<span id="cess"></span></p>
    <p>Net Income: ₹<span id="net"></span></p>
    <p>Monthly Tax: ₹<span id="monthly"></span></p>
  </div>
  <p class="note">*This is an estimate. Standard deduction of 75,000 included in New Regime. Consult CA for exact filing.</p>
</div>

<a href="/" class="back">← Back to Home</a>

<script>
function calculateTax() {
  let income = parseFloat(document.getElementById('income').value);
  let regime = document.getElementById('regime').value;
  let deduction = parseFloat(document.getElementById('deduction').value) || 0;
  
  if(!income) { alert("Please enter income"); return; }

  let taxable = income;
  let tax = 0;

  if(regime === 'new') {
    taxable = income - 75000; // Standard deduction
    if(taxable <= 400000) tax = 0;
    else if(taxable <= 800000) tax = (taxable - 400000) * 0.05;
    else if(taxable <= 1200000) tax = 20000 + (taxable - 800000) * 0.1;
    else if(taxable <= 1600000) tax = 60000 + (taxable - 1200000) * 0.15;
    else if(taxable <= 2000000) tax = 120000 + (taxable - 1600000) * 0.2;
    else if(taxable <= 2400000) tax = 200000 + (taxable - 2000000) * 0.25;
    else tax = 300000 + (taxable - 2400000) * 0.3;
  } 
  
  else { // Old Regime
    taxable = income - deduction - 50000; // Standard deduction
    if(taxable <= 250000) tax = 0;
    else if(taxable <= 500000) tax = (taxable - 250000) * 0.05;
    else if(taxable <= 1000000) tax = 12500 + (taxable - 500000) * 0.2;
    else tax = 112500 + (taxable - 1000000) * 0.3;
  }

  if(tax < 0) tax = 0;
  let cess = tax * 1.04;
  let net = income - cess;
  let monthly = cess / 12;

  document.getElementById('tax').innerText = tax.toFixed(0);
  document.getElementById('cess').innerText = cess.toFixed(0);
  document.getElementById('net').innerText = net.toFixed(0);
  document.getElementById('monthly').innerText = monthly.toFixed(0);
  document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Currency Converter - USD to INR, EUR to INR, GBP to INR | Pogi Tools</title>
<meta name="description" content="Free Currency Converter. Convert USD, EUR, GBP to INR with live rates. 160+ currencies supported. Fast and accurate.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 500px; margin: auto; }
h1 { text-align: center; color: #2c3e50; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 12px; margin-top: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #219150; }
.result { margin-top: 20px; padding: 20px; background: #eaf1; border-radius: 8px; text-align: center; font-size: 22px; font-weight: bold; display: none; }
.note { font-size: 12px; color: #777; margin-top: 15px; text-align: center; }
.back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #2c3e50; }
.swap { text-align: center; margin: 10px 0; font-size: 24px; cursor: pointer; }
</style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEDR5G54L6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZEDR5G54L6');
</script>
</head>
<body>

<h1>Currency Converter</h1>
<div class="card">
  <label>Amount</label>
  <input type="number" id="amount" placeholder="Enter amount" value="1">

  <label>From</label>
  <select id="from">
    <option value="USD">🇺🇸 USD - US Dollar</option>
    <option value="EUR">🇪🇺 EUR - Euro</option>
    <option value="GBP">🇬🇧 GBP - British Pound</option>
    <option value="AED">🇦🇪 AED - UAE Dirham</option>
    <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
    <option value="INR" selected>🇮🇳 INR - Indian Rupee</option>
  </select>

  <div class="swap" onclick="swapCurrency()">⇅</div>

  <label>To</label>
  <select id="to">
    <option value="USD">🇺🇸 USD - US Dollar</option>
    <option value="EUR">🇪🇺 EUR - Euro</option>
    <option value="GBP">🇬🇧 GBP - British Pound</option>
    <option value="AED">🇦🇪 AED - UAE Dirham</option>
    <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
    <option value="INR" selected>🇮🇳 INR - Indian Rupee</option>
  </select>

  <button onclick="convert()">Convert</button>

  <div class="result" id="resultBox"></div>
  <p class="note">*Rates updated: 15 Aug 2025. Update monthly or add API later.</p>
</div>

<a href="/" class="back">← Back to Home</a>

<script>
// Update these rates every month
const rates = {
  USD: 83.45, // 1 USD = 83.45 INR
  EUR: 90.12, // 1 EUR = 90.12 INR 
  GBP: 105.80, // 1 GBP = 105.80 INR
  AED: 22.72, // 1 AED = 22.72 INR
  CAD: 61.90, // 1 CAD = 61.90 INR
  INR: 1
};

function convert() {
  let amount = parseFloat(document.getElementById('amount').value);
  let from = document.getElementById('from').value;
  let to = document.getElementById('to').value;

  if(!amount || amount <= 0) { alert("Please enter valid amount"); return; }

  // Convert to INR first, then to target currency
  let inINR = amount * rates[from];
  let result = inINR / rates[to];

  document.getElementById('resultBox').innerText = `${amount} ${from} = ${result.toFixed(2)} ${to}`;
  document.getElementById('resultBox').style.display = 'block';
}

function swapCurrency() {
  let from = document.getElementById('from');
  let to = document.getElementById('to');
  let temp = from.value;
  from.value = to.value;
  to.value = temp;
  convert();
}

// Run on page load
convert();
</script>

</body>
</html>

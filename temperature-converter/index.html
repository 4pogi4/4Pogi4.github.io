<!DOCTYPE html>
<html lang="en">
<head>
<title>Temperature Converter - Celsius to Fahrenheit to Kelvin | Pogi Tools</title>
<meta name="description" content="Free Temperature Converter. Convert °C to °F, °F to °C, °C to K, K to °C instantly. Accurate conversion tool.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 500px; margin: auto; }
h1 { text-align: center; color: #2c3e50; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 12px; margin-top: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #c0392b; }
.result { margin-top: 20px; padding: 20px; background: #ffeaa7; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; color: #d63031; }
</style>
</head>
<body>

<h1>Temperature Converter</h1>
<div class="card">
  <label>Value</label>
  <input type="number" id="value" value="40">

  <label>From</label>
  <select id="from">
    <option value="C">Celsius °C</option>
    <option value="F">Fahrenheit °F</option>
    <option value="K">Kelvin K</option>
  </select>

  <label>To</label>
  <select id="to">
    <option value="F">Fahrenheit °F</option>
    <option value="C">Celsius °C</option>
    <option value="K">Kelvin K</option>
  </select>

  <button onclick="convert()">Convert</button>

  <div class="result" id="result">40°C = 104.00°F</div>
</div>

<script>
function convert() {
  var val = parseFloat(document.getElementById('value').value);
  var from = document.getElementById('from').value;
  var to = document.getElementById('to').value;
  var result = 0;

  // to Celsius
  var c;
  if(from == 'C') c = val;
  if(from == 'F') c = (val - 32) * 5/9;
  if(from == 'K') c = val - 273.15;

  // from Celsius
  if(to == 'C') result = c;
  if(to == 'F') result = (c * 9/5) + 32;
  if(to == 'K') result = c + 273.15;

  document.getElementById('result').innerHTML = val + '°' + from + ' = ' + result.toFixed(2) + '°' + to;
}
</script>

</body>
</html>

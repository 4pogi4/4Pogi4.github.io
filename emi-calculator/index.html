<!DOCTYPE html>
<html lang="en">
<head>
  <title>EMI Calculator - Home, Car, Personal Loan EMI Online | Pogi Tools</title>
<meta name="description" content="Free EMI Calculator. Calculate Home Loan, Car Loan, Personal Loan EMI, Interest, and Total Payment. Includes loan amortization table.">
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; max-width: 500px; margin: auto; }
h1 { text-align: center; color: #2c3e50; }
.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; font-weight: bold; }
input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
button { width: 100%; padding: 12px; margin-top: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #219150; }
.result { margin-top: 20px; padding: 15px; background: #eafaf1; border-radius: 8px; display: none; }
.result h3 { margin: 0; color: #27ae60; }
.back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #2c3e50; }
</style>
</head>
<body>

<h1>EMI Calculator</h1>
<div class="card">
  <label>Loan Amount ₹</label>
  <input type="number" id="amount" placeholder="e.g. 500000">

  <label>Interest Rate % per Year</label>
  <input type="number" id="rate" placeholder="e.g. 10.5" step="0.1">

  <label>Loan Tenure in Months</label>
  <input type="number" id="months" placeholder="e.g. 60">

  <button onclick="calculateEMI()">Calculate EMI</button>

  <div class="result" id="resultBox">
    <h3>Monthly EMI: ₹<span id="emi"></span></h3>
    <p>Total Interest: ₹<span id="interest"></span></p>
    <p>Total Amount: ₹<span id="total"></span></p>
  </div>
</div>

<a href="/" class="back">← Back to Home</a>

<script>
function calculateEMI() {
  let P = parseFloat(document.getElementById('amount').value);
  let R = parseFloat(document.getElementById('rate').value) / 12 / 100;
  let N = parseFloat(document.getElementById('months').value);

  if(!P || !R || !N) { alert("Please fill all fields"); return; }

  let emi = (P * R * Math.pow(1+R, N)) / (Math.pow(1+R, N) - 1);
  let total = emi * N;
  let interest = total - P;

  document.getElementById('emi').innerText = emi.toFixed(0);
  document.getElementById('interest').innerText = interest.toFixed(0);
  document.getElementById('total').innerText = total.toFixed(0);
  document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
    </html>

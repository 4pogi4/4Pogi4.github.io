<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator - % Increase, Decrease, Change Online | Pogi Tools</title>
<meta name="description" content="Free Percentage Calculator. Calculate percentage increase, decrease, change, % of a number instantly. Mobile friendly.">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #result { margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; font-weight: bold; }
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEDR5G54L6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZEDR5G54L6');
</script>
</head>
<body>

<div class="box">
  <h1>Percentage Calculator</h1>
  
  <label>What is</label>
  <input type="number" id="percent" placeholder="Enter % e.g. 20">
  
  <label>% of</label>
  <input type="number" id="number" placeholder="Enter number e.g. 500">
  
  <button onclick="calcPercent()">Calculate</button>
  
  <div id="result"></div>
</div>

<script>
function calcPercent(){
  let p = document.getElementById('percent').value;
  let n = document.getElementById('number').value;
  let ans = (p/100) * n;
  document.getElementById('result').innerHTML = `${p}% of ${n} = <b>${ans}</b>`;
}
</script>

</body>
  </html>
